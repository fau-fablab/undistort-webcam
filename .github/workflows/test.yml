name: Run tests

on:
  push:
    branches: [ ]
  pull_request:
    branches: [ ]

jobs:
  test:

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install docker-compose
        uses: docker/setup-compose-action@v1

      - name: Run tests
        run: sudo ./run_test_docker.sh

        
